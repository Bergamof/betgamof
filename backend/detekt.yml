build:
  maxIssues: 0

style:
  MaxLineLength:
    # Same limit as ktlint (ktlint_official code style).
    maxLineLength: 140
  MagicNumber:
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreNumbers: ['-1', '0', '1', '2', '100', '100.0']
    # Demo seed (adapters/demo) and simulated odds catalog (adapters/odds) are fixture data.
    excludes: ['**/test/**', '**/testFixtures/**', '**/adapter/demo/**', '**/adapter/odds/**']

naming:
  FunctionNaming:
    # Backtick test names, also in the contract suites shared through testFixtures.
    excludes: ['**/test/**', '**/testFixtures/**']

complexity:
  LongParameterList:
    excludes: ['**/test/**', '**/testFixtures/**', '**/adapter/demo/**', '**/adapter/odds/**']
  LongMethod:
    excludes: ['**/adapter/odds/**']
  TooManyFunctions:
    excludes: ['**/test/**', '**/testFixtures/**', '**/adapter/demo/**']

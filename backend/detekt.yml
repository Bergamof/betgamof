build:
  maxIssues: 0

style:
  MaxLineLength:
    # Same limit as ktlint (ktlint_official code style).
    maxLineLength: 140
  MagicNumber:
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreNumbers: ['-1', '0', '1', '2', '100', '100.0']
    # Demo seed (application/seed) and simulated odds catalog (outbound/odds) are fixture data.
    excludes: ['**/test/**', '**/seed/**', '**/outbound/odds/**']

complexity:
  LongParameterList:
    excludes: ['**/test/**', '**/seed/**', '**/outbound/odds/**']
  LongMethod:
    excludes: ['**/outbound/odds/**']
  TooManyFunctions:
    excludes: ['**/test/**', '**/seed/**']
